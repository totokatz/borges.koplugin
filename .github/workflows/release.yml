name: Publish plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify version and build installable archives
        run: python scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > dist/NOTES.md <<'NOTES'
          ## Download Borges

          Download **borges.koplugin.zip** below. Extract `borges.koplugin` into `koreader/plugins/` and restart KOReader.
          [Installation guide](https://github.com/totokatz/borges.koplugin#install-in-three-steps) · [Español](https://github.com/totokatz/borges.koplugin/blob/main/docs/README.es.md)

          **Updating an earlier installation:** close KOReader, rename the existing Borges plugin folder to `borges.koplugin`, then copy the new files over it. Keep your local configuration and leave only one copy of the plugin.

          **Borges for Xteink X4:** [download and installation](https://github.com/totokatz/borges.koplugin/blob/main/docs/FIRMWARE.md).
          GitHub's **Source code** archives are not installation packages.

          ## Changes
          NOTES
          awk -v v="## ${version}" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' borges.koplugin/RELEASE_NOTES.md >> dist/NOTES.md
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Published archives are immutable: never silently replace downloads.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version instead.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "Borges for KOReader ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md

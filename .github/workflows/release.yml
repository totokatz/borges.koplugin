name: Publish plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify version and build installable archives
        run: python scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > dist/NOTES.md <<'NOTES'
          ## Descargar / Download

          **KOReader:** descargá / download **borges.koplugin.zip** abajo / below.
          Extraé / extract `highlightsdetoto.koplugin` dentro de / into `koreader/plugins/` y reiniciá / restart KOReader.
          [Guía en castellano](https://github.com/totokatz/borges.koplugin#instalar) · [English guide](https://github.com/totokatz/borges.koplugin/blob/main/docs/README.en.md)

          **CrossPoint / Xteink X4:** [descarga e instalación / download and installation](https://github.com/totokatz/borges.koplugin/blob/main/docs/CROSSPOINT.md).

          Los archivos **Source code** no son instalables. / **Source code** archives are not installation packages.
          El ZIP con nombre anterior es idéntico y se conserva para enlaces existentes. / The legacy-named ZIP is identical and kept for existing links.

          ## Cambios / Changes
          NOTES
          awk -v v="## ${version}" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' highlightsdetoto.koplugin/RELEASE_NOTES.md >> dist/NOTES.md
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Published archives are immutable: never silently replace downloads.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version instead.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "Borges para KOReader ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md

name: Publish Borges downloads
on:
  push:
    branches: [main]
    paths: [presentation.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed presentation
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          source = pathlib.Path("presentation.zip")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "22986262e867830445dd53f9425d1c2baa816fc1cffc5efe7b239ba916bc8ec4"
          with zipfile.ZipFile(source) as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] in {"README.md", ".gitignore", ".gitattributes", ".github", "docs", "scripts"}
                  target = pathlib.Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          PY
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/package.py --tag v2026.09.20.2
      - name: Add stable download without replacing published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original
          gh release download v2026.09.20.2 --pattern highlightsdetoto.koplugin-2026.09.20.2.zip --dir original
          echo "1ea50ce80eb150b0fa27f69f38e6c2da5304fef3347999374369bdc7f5111002  original/highlightsdetoto.koplugin-2026.09.20.2.zip" | sha256sum -c -
          python scripts/package.py --verify original/highlightsdetoto.koplugin-2026.09.20.2.zip
          cp original/highlightsdetoto.koplugin-2026.09.20.2.zip original/borges.koplugin.zip
          (cd original && sha256sum borges.koplugin.zip > borges.koplugin.zip.sha256)
          if gh release view v2026.09.20.2 --json assets --jq '[.assets[].name] | index("borges.koplugin.zip")' | grep -q '^[0-9]'; then
            gh release download v2026.09.20.2 --pattern borges.koplugin.zip --dir existing
            cmp original/borges.koplugin.zip existing/borges.koplugin.zip
          else
            gh release upload v2026.09.20.2 original/borges.koplugin.zip original/borges.koplugin.zip.sha256
          fi
          cat > original/notes.md <<'NOTES'
          ## Descargar Borges

          **[KOReader: descargar borges.koplugin.zip](https://github.com/totokatz/borges.koplugin/releases/latest/download/borges.koplugin.zip)**
          Descomprimí y copiá la carpeta `highlightsdetoto.koplugin` dentro de `koreader/plugins/`. Reiniciá KOReader y abrí **Herramientas → Borges → Cuenta**.

          **[CrossPoint: descargar firmware para Xteink X4](https://github.com/runadev-arg/crosspoint-toto/releases/download/toto-v1.4.1-toto.1/firmware.bin)**
          CrossPoint se instala como firmware. [Leé la guía para X4 antes de instalar](https://github.com/totokatz/borges.koplugin/blob/main/docs/CROSSPOINT.md).

          [Guía de KOReader](https://github.com/totokatz/borges.koplugin#instalar) · [English](https://github.com/totokatz/borges.koplugin/blob/main/docs/README.en.md)

          Los archivos **Source code** no son el paquete instalable. El ZIP con nombre anterior conserva exactamente el mismo contenido y sigue disponible para los enlaces existentes.

          ## Cambios de esta versión

          - El plugin aparece como Borges en los mensajes de registro y como Biblioteca Borges en las pantallas de biblioteca.
          - Paquete instalable con verificación SHA-256.
          NOTES
          gh release edit v2026.09.20.2 --notes-file original/notes.md
      - name: Publish presentation and normalize original commit trailers
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(["git", *args], **kwargs).decode().strip()
          base = "633ea308049ef83872f03d559e14cb59e1da8bd7"
          first = "457f5b351da4bfad213c41791f11ca7a358d96f1"
          original = git("rev-list", "--reverse", base).splitlines()
          assert original == [first, base]
          for commit in git("rev-list", f"{base}..HEAD").splitlines():
              paths = git("diff-tree", "--no-commit-id", "--name-only", "-r", commit).splitlines()
              assert set(paths) <= {"presentation.zip", ".github/workflows/presentation.yml", ".github/workflows/check.yml", ".github/workflows/release.yml"}, paths
          mapping = {}
          for old in original:
              fields = git("show", "-s", "--format=%an%n%ae%n%aI%n%cn%n%ce%n%cI", old).splitlines()
              env = dict(os.environ)
              for key, value in zip(["GIT_AUTHOR_NAME", "GIT_AUTHOR_EMAIL", "GIT_AUTHOR_DATE", "GIT_COMMITTER_NAME", "GIT_COMMITTER_EMAIL", "GIT_COMMITTER_DATE"], fields):
                  env[key] = value
              message = re.sub(r"(?im)^Co-Authored-By:.*\n?", "", git("show", "-s", "--format=%B", old)).strip()
              args = ["commit-tree", git("rev-parse", old + "^{tree}")]
              if mapping:
                  args += ["-p", mapping[first]]
              mapping[old] = git(*args, input=(message + "\n").encode(), env=env)
          pathlib.Path("presentation.zip").unlink()
          git("add", "README.md", ".gitignore", ".gitattributes", ".github", "docs", "scripts", "presentation.zip")
          git("restore", "--source=HEAD", "--staged", ".github")
          assert not git("diff", "--cached", "--name-only", "--", "highlightsdetoto.koplugin")
          env = dict(os.environ, GIT_AUTHOR_NAME=fields[0], GIT_AUTHOR_EMAIL=fields[1], GIT_COMMITTER_NAME=fields[0], GIT_COMMITTER_EMAIL=fields[1])
          result = git("commit-tree", git("write-tree"), "-p", mapping[base], input="Presentación de Borges y descargas para KOReader y CrossPoint\n".encode(), env=env)
          tags = {"v2026.09.20.1": first, "v2026.09.20.2": base}
          tag_refs = {"v2026.09.20.1": "0e493d9bd34add422aca58833fa2f6550fea35cf", "v2026.09.20.2": "73e3042bf9947d9e55d6cfc075b6a90468862866"}
          new_tags = {}
          for tag, old in tags.items():
              assert git("rev-parse", "refs/tags/" + tag) == tag_refs[tag]
              assert git("rev-parse", "refs/tags/" + tag + "^{commit}") == old
              annotated = git("cat-file", "-p", "refs/tags/" + tag)
              annotated = annotated.replace("object " + old, "object " + mapping[old], 1)
              new_tags[tag] = git("mktag", input=(annotated + "\n").encode())
          git("update-ref", "refs/heads/main", result)
          for tag, old in tag_refs.items():
              git("update-ref", "refs/tags/" + tag, new_tags[tag], old)
          args = ["push", "--atomic", "--force-with-lease=refs/heads/main:" + os.environ["GITHUB_SHA"]]
          args += ["--force-with-lease=refs/tags/" + tag + ":" + old for tag, old in tag_refs.items()]
          args += ["origin", "refs/heads/main", *["refs/tags/" + tag for tag in tags]]
          print(git(*args))
          print("Published", result)
          PY
